name: Release Tack Browser for Mac

on:
  push:
    tags:
      - "tack-browser-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: extension/tack-browser-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/tack-browser-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Mac artifacts
        run: npm run dist:mac

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tack-browser-mac
          path: |
            extension/tack-browser-app/dist/*.zip
            extension/tack-browser-app/dist/*.dmg
            extension/tack-browser-app/dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Tack Browser ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: |
            extension/tack-browser-app/dist/*.zip
            extension/tack-browser-app/dist/*.dmg
            extension/tack-browser-app/dist/SHA256SUMS.txt
