<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinStyle AI</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- ── AUTH SCREEN ──────────────────────────────────────────────── -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-inner">
      <img src="pinstyle_logo.png" alt="PinStyle AI" class="auth-logo">
      <h1 class="auth-title">Welcome to <em>PinStyle</em></h1>
      <p class="auth-subtitle">New accounts get <strong>3 free generations</strong></p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="signup">Create Account</button>
      </div>

      <div class="auth-form">
        <input type="email"    id="auth-email"    class="auth-input" placeholder="Email address" autocomplete="email">
        <input type="password" id="auth-password" class="auth-input" placeholder="Password" autocomplete="current-password">
        <p id="auth-error" class="auth-error"></p>
        <button id="auth-submit" class="auth-submit-btn">Sign In</button>
      </div>
    </div>
  </div>

  <!-- ── MAIN UI ───────────────────────────────────────────────────── -->
  <header>
    <div class="header-top">
      <img src="pinstyle_logo.png" alt="PinStyle AI" style="height:28px;width:auto;filter:brightness(0.9);">
      <span class="header-badge">Beta</span>
    </div>
    <p class="header-tagline">Select images. <span class="gold">Generate their style.</span></p>
  </header>

  <main>

    <!-- ── IMAGE PICKER ──────────────────────────────────────── -->
    <section>
      <div class="scan-row">
        <div>
          <div id="status"></div>
          <div id="scan-hint-inline" style="font-size:11px;color:var(--ink-muted);margin-top:2px;"></div>
        </div>
        <button class="btn-scan" id="refresh-btn">↻ Rescan</button>
      </div>
      <div id="image-grid"></div>
    </section>

    <hr class="divider">

    <!-- ── SUBJECT INPUT ─────────────────────────────────────── -->
    <section>
      <label class="input-label" for="subject-input">
        What do you want to <em>create?</em>
      </label>
      <textarea
        id="subject-input"
        placeholder="e.g. a cozy coffee shop interior, a woman in a linen dress, a minimalist product shot…"
        rows="3"
      ></textarea>
    </section>

    <!-- ── GENERATE ──────────────────────────────────────────── -->
    <button id="generate-btn" disabled>
      Generate Images
    </button>

    <!-- ── TRIAL BADGE ───────────────────────────────────────── -->
    <div id="trial-badge" class="trial-badge hidden"></div>

    <!-- ── RESULTS ───────────────────────────────────────────── -->
    <section id="results" class="hidden"></section>

  </main>

  <!-- ── HISTORY PANEL ───────────────────────────────────────── -->
  <div id="history-panel" class="history-panel hidden">
    <div class="history-header">
      <span>Generation History</span>
      <button id="history-close">✕</button>
    </div>
    <div id="history-list"></div>
  </div>

  <footer>
    <button id="history-btn" class="history-toggle">🕓 History</button>
    <div style="display:flex;align-items:center;gap:12px">
      <a href="https://pinstyle.co" target="_blank" rel="noopener" style="font-size:10px;color:var(--ink-muted);text-decoration:none;">pinstyle.co</a>
      <button id="logout-btn" class="logout-btn">Sign out</button>
    </div>
  </footer>

  <!-- Image preview overlay -->
  <div id="preview-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:999;align-items:center;justify-content:center;cursor:pointer;" onclick="this.style.display='none'">
    <img id="preview-img" style="max-width:90%;max-height:90%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.8);">
    <div style="position:absolute;top:16px;right:20px;color:rgba(255,255,255,0.5);font-size:24px;cursor:pointer;" onclick="document.getElementById('preview-overlay').style.display='none'">✕</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
