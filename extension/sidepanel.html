<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinStyle AI</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo-lockup">
        <div class="logo-pin"></div>
        <span class="logo-text">Pin<em>Style</em> AI</span>
      </div>
      <span class="header-badge">Beta</span>
    </div>
    <p class="header-tagline">Select images. Generate their style.</p>
  </header>

  <main>

    <!-- ── IMAGE PICKER ──────────────────────────────────────── -->
    <section>
      <div class="scan-row">
        <span class="section-label">Images on this page</span>
        <button class="btn-scan" id="refresh-btn">↻ Rescan</button>
      </div>
      <div id="status"></div>
      <div id="image-grid"></div>
    </section>

    <hr class="divider">

    <!-- ── SUBJECT INPUT ─────────────────────────────────────── -->
    <section>
      <label class="input-label" for="subject-input">
        What do you want to <em>create?</em>
      </label>
      <textarea
        id="subject-input"
        placeholder="e.g. a cozy coffee shop interior, a woman in a linen dress, a minimalist product shot…"
        rows="3"
      ></textarea>
    </section>

    <!-- ── GENERATE ──────────────────────────────────────────── -->
    <button id="generate-btn" disabled>
      Generate Images
    </button>

    <!-- ── RESULTS ───────────────────────────────────────────── -->
    <section id="results" class="hidden"></section>

  </main>

  <!-- ── HISTORY PANEL ───────────────────────────────────────── -->
  <div id="history-panel" class="history-panel hidden">
    <div class="history-header">
      <span>Generation History</span>
      <button id="history-close">✕</button>
    </div>
    <div id="history-list"></div>
  </div>

  <footer>
    <button id="history-btn" class="history-toggle">🕓 History</button>
    <a href="https://pinstyle.co" target="_blank" rel="noopener">pinstyle.co</a>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
