<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — tack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #f0ebe3;
      --ink-muted: #8a8070;
      --accent:    #013FF4;
      --error:     #e03d2f;
      --bg:        #0e0c0a;
      --bg2:       #141210;
      --border:    rgba(240, 235, 227, 0.08);
      --accent:      #013FF4;
      --accent-light: #8FBEF7;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(14,12,10,0.95), transparent);
      z-index: 10;
    }

    .logo {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    .logo span { color: var(--accent-light); }

    .nav-link {
      font-size: 13px;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--ink); }

    .card {
      position: relative;
      z-index: 2;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 52px 60px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    .check-ring {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: rgba(201,169,110,0.1);
      border: 1.5px solid rgba(201,169,110,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }
    h1 em { font-style: italic; color: var(--accent-light); }

    .sub {
      font-size: 14px;
      color: var(--ink-muted);
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .close-btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 100px;
      padding: 14px 28px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      margin-bottom: 16px;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 20px rgba(224,61,47,0.25);
    }
    .close-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .hint {
      font-size: 11px;
      color: var(--ink-muted);
      opacity: 0.55;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto;
    }

    .divider {
      width: 36px; height: 1px;
      background: var(--border);
      margin: 28px auto;
    }

    .plan-link {
      font-size: 12px;
      color: var(--ink-muted);
      text-decoration: none;
      border-bottom: 1px solid rgba(240,235,227,0.12);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .plan-link:hover { color: var(--accent-light); border-color: var(--accent-light); }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo" aria-label="tack home">
      <img src="/tack_logo.svg" alt="tack" style="height:28px;width:auto;display:block;">
    </a>
    <a href="/account" class="nav-link" id="accountLink">My account</a>
  </nav>

  <div class="card">

    <div class="check-ring">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M6 14.5L11.5 20L22 9" stroke="#8FBEF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="eyebrow">Email confirmed</div>
    <h1>You're in,<br><em>let's create.</em></h1>
    <p class="sub">Your account is active. Go back to the extension and keep creating.</p>

    <button class="close-btn" onclick="window.close()">Close this tab</button>

    <p class="hint">If this tab doesn't close, just switch back to Chrome manually — tack is ready for you there.</p>

    <div class="divider"></div>

    <a href="/upgrade" class="plan-link" id="planLink">View plans &amp; pricing →</a>

  </div>

  <script>
    const SUPABASE_URL = 'https://sbdowcielgtcfholfyry.supabase.co';
    const SUPABASE_ANON_KEY = '<SECRET>';

    function getStoredSession() {
      try {
        return JSON.parse(localStorage.getItem('tack_session') || 'null');
      } catch {
        return null;
      }
    }

    function storeSessionFromHash() {
      if (!window.location.hash.includes('access_token=')) return null;
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const accessToken = hash.get('access_token');
      if (!accessToken) return null;
      const session = {
        access_token: accessToken,
        refresh_token: hash.get('refresh_token'),
        token_type: hash.get('token_type') || 'bearer',
      };
      localStorage.setItem('tack_session', JSON.stringify(session));
      history.replaceState({}, document.title, `${window.location.pathname}${window.location.search}`);
      return session;
    }

    async function refreshSession(refreshToken) {
      if (!refreshToken) return null;
      const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ refresh_token: refreshToken }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.access_token) return null;
      return data;
    }

    async function resolveSession() {
      const fromHash = storeSessionFromHash();
      const stored = fromHash || getStoredSession();
      if (!stored?.access_token) return null;
      try {
        const payload = JSON.parse(atob(stored.access_token.split('.')[1]));
        if (payload.exp * 1000 > Date.now()) return stored;
      } catch {
        return null;
      }
      if (!stored.refresh_token) return null;
      const refreshed = await refreshSession(stored.refresh_token).catch(() => null);
      if (refreshed?.access_token) {
        localStorage.setItem('tack_session', JSON.stringify(refreshed));
        return refreshed;
      }
      return null;
    }

    function buildSessionHash(session) {
      if (!session?.access_token) return '';
      const hash = new URLSearchParams();
      hash.set('access_token', session.access_token);
      if (session.refresh_token) hash.set('refresh_token', session.refresh_token);
      if (session.token_type) hash.set('token_type', session.token_type);
      return `#${hash.toString()}`;
    }

    (async function init() {
      const session = await resolveSession();
      const planLink = document.getElementById('planLink');
      const accountLink = document.getElementById('accountLink');
      if (!session?.access_token) return;
      const sessionHash = buildSessionHash(session);
      if (sessionHash) {
        planLink.href = `/upgrade${sessionHash}`;
        accountLink.href = `/account${sessionHash}`;
      } else {
        planLink.href = '/upgrade';
        accountLink.href = '/account';
      }
    })();
  </script>

</body>
</html>
